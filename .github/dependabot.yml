# Dependabot keeps dependencies and action versions current.
# Updates are grouped so one PR covers an ecosystem's minor/patch bumps.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      githubactions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "swift"
    # The repository root holds no Package.swift - the packages live under Packages/ - so
    # `directory: "/"` failed every week with "No files found in /" and Swift dependencies were
    # never checked at all. Only these two have external dependencies; HomeBudgetCore has none,
    # and HomeBudgetiOS is an Xcode project, not a SwiftPM package.
    directories:
      - "/Packages/Server"
      - "/Packages/WebClient"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      swift-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The Swift image version is coupled to the WebAssembly SDK, the CI test container and the
      # Makefile. Bumping it on its own breaks the image build with "module compiled with Swift X
      # cannot be imported by the Swift Y compiler" - which is exactly what 6.3.3 -> 6.4.0 did.
      # Upgrade Swift deliberately, in lockstep, not by merging a dependency PR.
      - dependency-name: "library/swift"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
