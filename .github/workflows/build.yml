name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # This repository is public, so a secret that reaches a commit is a secret that is gone. Cheaper
  # to fail a pull request than to rotate a credential and rewrite history afterwards.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compares against the base of the pull request, so it needs the history that
          # a shallow clone would leave out.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One number, recorded in three places. Cheap to check, and the failure it prevents — an image
  # tagged v1.1.0 that reports 1.0.0 from /health — is the kind you only notice when debugging
  # something else.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, the iOS project and any tag must agree
        run: |
          file=$(cat VERSION)
          ios=$(grep -m1 MARKETING_VERSION Packages/HomeBudgetiOS/project.yml | sed 's/.*: *//' | tr -d '"')
          echo "VERSION=$file  project.yml=$ios  ref=${GITHUB_REF#refs/tags/}"
          [ "$file" = "$ios" ] || { echo "::error::VERSION ($file) and project.yml ($ios) disagree"; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              [ "$file" = "$tag" ] || { echo "::error::tag v$tag does not match VERSION ($file)"; exit 1; }
              ;;
          esac
          grep -q "^## \[$file\]" CHANGELOG.md || echo "::warning::CHANGELOG.md has no section for $file"

  test:
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4

      - name: Test the domain core
        working-directory: Packages/HomeBudgetCore
        run: swift test

      - name: Test the server
        working-directory: Packages/Server
        run: swift test

  web:
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4

      # Compiling the client to WebAssembly is the check that HomeBudgetCore stays free of
      # Foundation and other host-only dependencies.
      - name: Install the WebAssembly SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7

      - name: Build the client
        working-directory: Packages/WebClient
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm -c release

  # The iOS app and its widget are the largest package here and nothing else compiles them. Free on
  # a public repository: GitHub's hosted macOS runners are unmetered for those.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the image
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The project is generated rather than committed, so CI has to make it the same way a person
      # does — which also proves project.yml still describes a buildable project.
      - name: Generate the Xcode project
        working-directory: Packages/HomeBudgetiOS
        run: xcodegen

      # A generic destination, not a named device: a runner image update that retires
      # "iPhone 17 Pro" would otherwise break the build for a reason that has nothing to do with
      # the change under test. Simulator builds sign locally, so no certificates are needed.
      - name: Build the app and the widget
        working-directory: Packages/HomeBudgetiOS
        run: |
          xcodebuild -project HomeBudget.xcodeproj -scheme HomeBudget \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build

  image:
    needs: [version, test, web, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
